<!DOCTYPE html>
<html>
    <head>
        <title>5f 5g</title>
    </head>
    <body>
        <script>
            let cost=5 + (2 * 3) + 9; //$20
            let tax=cost * 0.1; // $2

            console.log('Tax (10%): $${tax}'); // 5f

            let totalCost=cost + tax;
            console.log(`Total Cost: $${totalCost}`); // 5g ->$22
        </script>
    </body>
</html>
